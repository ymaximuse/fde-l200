[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fde-l200"
version = "0.1.0"
description = "Barebones Google ADK Python project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "google-adk",
  "python-dotenv",
]

[tool.setuptools.packages.find]
include = ["agent*"]
